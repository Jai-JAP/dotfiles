[package_management]
manager = "uv"

[experimental]

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = false

[formatting]
line_length = 100

[diagnostics]

[server]
browser = "default"
follow_symlink = false

[ai]
rules = ""

[ai.google]

[ai.anthropic]

[ai.open_ai]

[ai.bedrock]

[language_servers.pylsp]
enabled = true
enable_flake8 = false
enable_ruff = true
enable_pylint = false
enable_mypy = true
enable_pyflakes = false
enable_pydocstyle = false

[keymap]
preset = "default"

[keymap.overrides]

[display]
theme = "system"
dataframes = "rich"
code_editor_font_size = 14
cell_output = "below"
default_width = "medium"
default_table_page_size = 10

[completion]
copilot = false
activate_on_typing = true

[snippets]
custom_paths = []
include_default_snippets = true

[runtime]
auto_instantiate = false
output_max_bytes = 8000000
auto_reload = "off"
on_cell_change = "autorun"
reactive_tests = true
default_sql_output = "auto"
std_stream_max_bytes = 1000000
pythonpath = []
watcher_on_save = "lazy"
